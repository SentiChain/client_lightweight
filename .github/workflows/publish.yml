name: Publish package

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload validated distributions to PyPI
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: publish-package
  cancel-in-progress: false

jobs:
  checks:
    if: github.ref == 'refs/heads/master'
    uses: ./.github/workflows/check.yml

  publish:
    if: inputs.publish && github.ref == 'refs/heads/master'
    needs: checks
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/sentichain/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: distributions
          path: dist/
      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
