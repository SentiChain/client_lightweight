name: Check package

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: python -m pip install ".[dev]"
      - name: Check style
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Run tests
        run: python -m pytest -m "not live" --cov --cov-report=term-missing

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install ".[dev]"
      - name: Audit runtime dependencies
        run: python -m pip_audit --skip-editable
      - name: Build distributions
        run: python -m build
      - name: Validate package metadata
        run: python -m twine check --strict dist/*
      - name: Verify installed wheel
        shell: bash
        run: |
          python -m venv /tmp/sentichain-wheel
          /tmp/sentichain-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/sentichain-wheel/bin/python -c "from sentichain import Client, Transaction, APIError; from sentichain.keys import generate_key_pair"
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
